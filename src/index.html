<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/presentation/style.css"><title>Особисті фінанси</title></head><body><main><header><small>PERSONAL FINANCE PWA · MVP</small><h1>Особисті фінанси</h1><p>Облік доходів і витрат</p></header><section class="balance">Поточний баланс<strong id="balance">0 грн</strong></section><section><h2>Додати операцію</h2><form id="transaction" novalidate><label>Тип<select name="type"><option value="income">Дохід</option><option value="expense">Витрата</option></select></label><label>Сума, грн<input name="amount" type="number" step="0.01" required></label><label>Дата<input name="date" type="date" required></label><label>Категорія<input name="category" required maxlength="80"></label><button>Зберегти операцію</button><p id="status" role="status"></p></form></section><section><h2>Історія операцій</h2><table><thead><tr><th>Дата</th><th>Категорія</th><th>Тип</th><th>Сума</th></tr></thead><tbody id="history"></tbody></table></section><footer>Локальний прототип · дані зберігаються у браузері</footer></main><script type="module" src="/presentation/app.js"></script></body></html>
